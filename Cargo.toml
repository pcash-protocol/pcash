[workspace]
resolver = "2"
members = ["node/crates/[!.]*"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
alloy-consensus = "2.1"
alloy-json-rpc = "2.1"
alloy-network-primitives = "2.1"
alloy-primitives = "1.6"
alloy-rpc-client = "2.1"
alloy-rpc-types-eth = "2.1"
alloy-sol-types = "1.6"
alloy-transport = "2.1"
alloy-transport-http = "2.1"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
eyre = "0.6"
futures = "0.3"
hex = "0.4"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
prometheus-client = "0.23"
redb = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
sha2 = "0.10"
sha3 = "0.10"
tempfile = "3"
thiserror = "2"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "fat"
codegen-units = 1
# Unwinding stays on: the mempool's verifier workers catch a panicking admission.

[workspace.lints.clippy]
# Priority -1 so individual lint settings override
pedantic = { level = "warn", priority = -1 }

missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
items_after_statements = "allow"
uninlined_format_args = "allow"
return_self_not_must_use = "allow"

cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"

default_trait_access = "allow"

match_same_arms = "allow"

unused_async = "allow"

manual_let_else = "allow"

used_underscore_binding = "allow"

ref_option_ref = "allow"
ref_option = "allow"

format_push_string = "allow"

case_sensitive_file_extension_comparisons = "allow"

unnecessary_wraps = "allow"

needless_pass_by_value = "allow"

trivially_copy_pass_by_ref = "allow"

no_effect_underscore_binding = "allow"

redundant_closure_for_method_calls = "allow"

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

allow_attributes_without_reason = "deny"

result_large_err = "allow"

dbg_macro = "deny"

todo = "deny"
unimplemented = "deny"

# Use tracing instead of println/eprintln in library code
# CLI crates override this via #[allow(...)] in lib.rs/main.rs
print_stdout = "deny"
print_stderr = "deny"

# sol! macro generates functions with many params - can't control this
too_many_arguments = "allow"

unused_self = "allow"

explicit_iter_loop = "allow"

should_implement_trait = "allow"

self_named_constructors = "allow"

if_not_else = "allow"

doc_link_with_quotes = "allow"

match_wildcard_for_single_variants = "allow"

collapsible_if = "allow"
