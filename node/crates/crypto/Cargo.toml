[package]
name = "pcash-crypto"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "PCASH cryptographic primitives: Poseidon2 sponge, Merkle ladder, domain tags"

[lints]
workspace = true

[dependencies]
alloy-primitives = { workspace = true }
ark-bn254 = { version = "0.5", default-features = false, features = ["scalar_field"] }
ark-ff = { version = "0.5", default-features = false, features = ["asm"] }
sha2 = { workspace = true }

[dev-dependencies]
alloy-primitives = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
