[package]
name = "pcash-l1"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "PCASH L1 follower: Ethereum JSON-RPC block/receipt ingestion and reorg-aware cursor"

[lints]
workspace = true

[dependencies]
pcash-da = { path = "../da" }

alloy-provider = { version = "2.1", default-features = false, features = ["reqwest", "throttle"] }
alloy-rpc-client = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
alloy-primitives = { workspace = true }
alloy-transport-http = { workspace = true }
alloy-consensus = { workspace = true }
alloy-network-primitives = { workspace = true }
alloy-transport = { workspace = true }
alloy-json-rpc = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["gzip"] }
tower = { workspace = true }
backon = { version = "1.6", default-features = false, features = ["std", "tokio-sleep"] }
futures = { workspace = true }
thiserror = { workspace = true }
pcash-crypto = { path = "../crypto" }
ark-ff = { version = "0.5", default-features = false }
rayon = "1.10"

[dev-dependencies]
alloy-sol-types = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
