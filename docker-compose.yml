name: pcash-metrics

services:
  prometheus:
    image: prom/prometheus:v3.4.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PCASH_PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.6.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./compose/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./node/crates/metrics/dashboards:/var/lib/grafana/dashboards/node:ro
      - ./wallet/dashboards:/var/lib/grafana/dashboards/wallet:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${PCASH_GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
