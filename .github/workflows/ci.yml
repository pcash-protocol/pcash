name: CI

on:
  workflow_dispatch:
    inputs:
      core:
        description: Core validation gate
        type: choice
        required: true
        options:
          - fast
          - full
        default: fast
      browser:
        description: Run browser integration tests after the core gate
        type: boolean
        default: false
      acceptance:
        description: Run real-node acceptance scenarios with the core gate
        type: boolean
        default: false
      metamask:
        description: Run MetaMask end-to-end tests after the core gate
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  core:
    name: Core CI
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure temporary paths
        run: echo "PCASH_TOOL_ROOT=$RUNNER_TEMP/pcash-prover" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
          cache: npm
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.5
      - name: Cache prover toolchain
        if: inputs.core == 'full' || inputs.acceptance
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pcash-prover
          key: pcash-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('assets/prover-toolchain.json') }}
      - name: Fast checks
        if: inputs.core == 'fast'
        run: just ci-fast
      - name: Free runner disk
        if: inputs.core == 'full'
        # The full gate's Rust test targets outgrow the runner's free space;
        # drop preinstalled SDKs the gate never uses.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL && df -h /
      - name: Full checks
        if: inputs.core == 'full'
        run: just ci
      - name: Acceptance scenarios
        if: inputs.acceptance
        run: just ci-acceptance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: core-and-acceptance-logs
          path: |
            .cache/pcash/ci-all-runs/**/*.log
            .cache/pcash/ci-all-runs/**/results.json
            .cache/pcash/ci-all-runs/**/acceptance/**/logs
            .cache/pcash/ci-all-runs/**/acceptance/**/evidence.json
          if-no-files-found: warn
          retention-days: 7

  browser:
    name: Browser
    if: inputs.browser
    needs: core
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure temporary paths
        run: |
          echo "PCASH_TOOL_ROOT=$RUNNER_TEMP/pcash-prover" >> "$GITHUB_ENV"
          echo "PCASH_E2E_ASSET_BROWSER_RESULT=$RUNNER_TEMP/asset-browser-result.json" >> "$GITHUB_ENV"
          echo "PCASH_E2E_FUNDED_BROWSER_RESULT=$RUNNER_TEMP/wallet-funded-browser-result.json" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
          cache: npm
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.5
      - name: Cache prover toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pcash-prover
          key: pcash-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('assets/prover-toolchain.json') }}
      - run: just ci-browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-results
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: asset-browser-result
          path: ${{ runner.temp }}/asset-browser-result.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: wallet-funded-browser-result
          path: ${{ runner.temp }}/wallet-funded-browser-result.json
          if-no-files-found: warn
          retention-days: 7

  metamask:
    name: MetaMask
    if: inputs.metamask
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure temporary paths
        run: echo "PCASH_TOOL_ROOT=$RUNNER_TEMP/pcash-prover" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
          cache: npm
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.5
      - name: Cache prover toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pcash-prover
          key: pcash-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('assets/prover-toolchain.json') }}
      - run: just e2e-metamask
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: metamask-e2e-results
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: warn
          retention-days: 7

  p2p-nat:
    name: P2P discovery and real NAT traversal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install network namespace tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 iptables procps
      - name: Build transport acceptance fixture
        run: cargo build --locked -p pcash-p2p --example network_probe
      - name: Exercise discovery, hole punching and relay fallback
        run: sudo python3 scripts/test-p2p-nat.py --binary target/debug/examples/network_probe --output .cache/p2p-nat
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p2p-nat-logs
          path: .cache/p2p-nat
          if-no-files-found: warn
          retention-days: 7
