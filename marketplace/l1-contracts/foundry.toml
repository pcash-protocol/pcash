[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["dependencies"]
solc = "0.8.37"
optimizer = true
optimizer_runs = 200
# The marketplace client pins keccak256 of the deployed runtime bytecode
# (PAYMENT_ROUTER_RUNTIME_TEMPLATE_HASH). Pin the EVM version so forge upgrades
# cannot silently change the build output, and strip the CBOR metadata
# trailer so the runtime bytecode depends only on compiled logic, not on
# source text (comment edits changed the deployed bytecode via the embedded
# ipfs metadata hash).
evm_version = "cancun"
# Scripts and tests run under the L1's current fork, separately from the compile
# target above. Forge sizes a broadcast's gas limit from this simulation, so an
# older fork underprices contract creation and the deployment runs out of gas.
hardfork = "amsterdam"
cbor_metadata = false
bytecode_hash = "none"

[dependencies]
forge-std = "1.16.2"
"@openzeppelin-contracts" = "5.7.0"
