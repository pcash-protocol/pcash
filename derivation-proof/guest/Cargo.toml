[package]
name = "derivation-proof-guest"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "PCASH derivation from the anchor over authenticated Ethereum blocks, as an SP1 program"

# Built for SP1's RISC-V target with SP1's toolchain, apart from the node workspace.
[workspace]

[dependencies]
sp1-zkvm = "=6.10.0"
derivation-proof-core = { path = "../core" }
pcash-derive = { path = "../../node/crates/derive" }
pcash-state = { path = "../../node/crates/state", default-features = false }
pcash-verify = { path = "../../node/crates/verify", default-features = false }
alloy-primitives = "1.7"
alloy-sol-types = { version = "1.7", default-features = false }

[profile.release]
opt-level = 3

# SP1's accelerated hash and secp256k1 crates for 6.10.0, as op-succinct pins
# them, plus sha3 0.10, which the node crates use.
[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-6.10.0" }
sha3 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha3", tag = "patch-sha3-0.11.0-sp1-6.0.0" }
sha3-v10 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha3", tag = "patch-sha3-0.10.8-sp1-6.10.0" }
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-6.10.0" }
